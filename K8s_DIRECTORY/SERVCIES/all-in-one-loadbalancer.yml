apiVersion: v1
kind: Pod
metadata:
  name: app-pod-1
  labels:
    app: demoapp
spec:
  containers:
  - name: web
    image: nginx:alpine
    command: ["/bin/sh"]
    args: ["-c", "echo 'Hello from Pod-1' > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"]
---
apiVersion: v1
kind: Pod
metadata:
  name: app-pod-2
  labels:
    app: demoapp
spec:
  containers:
  - name: web
    image: nginx:alpine
    command: ["/bin/sh"]
    args: ["-c", "echo 'Hello from Pod-2' > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"]
---
apiVersion: v1
kind: Service
metadata:
  name: demoapp-service
spec:
  selector:
    app: demoapp
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
  type: NodePort
