apiVersion: v1
kind: Pod
metadata:
  name: pod1
  labels:
    app: hit-test
spec:
  containers:
  - name: web
    image: nginx
    ports:
    - containerPort: 80
    command:
    - sh
    - -c
    - |
      echo "hit pod1" > /usr/share/nginx/html/index.html
      nginx -g 'daemon off;'
---
apiVersion: v1
kind: Pod
metadata:
  name: pod2
  labels:
    app: hit-test
spec:
  containers:
  - name: web
    image: nginx
    ports:
    - containerPort: 80
    command:
    - sh
    - -c
    - |
      echo "hit pod2" > /usr/share/nginx/html/index.html
      nginx -g 'daemon off;'
---
apiVersion: v1
kind: Service
metadata:
  name: hit-test-nodeport
spec:
  type: NodePort
  selector:
    app: hit-test
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
